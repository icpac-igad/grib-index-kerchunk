# Lithops Configuration for ECMWF Parquet Processing
# ===================================================
#
# This config is auto-loaded by run_lithops_ecmwf.py when present
# in the same directory. Alternatively set LITHOPS_CONFIG_FILE env var.
#
# One-time setup:
#   1. Build runtime image via Cloud Build:
#      gcloud builds submit \
#        --config=cloudbuild.yaml \
#        --project=e4drr-crafd \
#        --service-account=projects/e4drr-crafd/serviceAccounts/ecmwf-lithops-deployer@e4drr-crafd.iam.gserviceaccount.com
#
#   2. Deploy as Cloud Run service:
#      lithops runtime deploy gcr.io/e4drr-crafd/ecmwf-lithops-runtime \
#        -b gcp_cloudrun -s gcp_storage --config lithops_config.yaml
#
# Management:
#   lithops runtime list -b gcp_cloudrun --config lithops_config.yaml
#   lithops runtime delete gcr.io/e4drr-crafd/ecmwf-lithops-runtime -b gcp_cloudrun -s gcp_storage --config lithops_config.yaml

lithops:
    backend: gcp_cloudrun
    storage: gcp_storage

gcp:
    project_name: e4drr-crafd
    region: europe-west3       # Frankfurt - closest GCP region to AWS eu-central-1 (ECMWF S3)
    credentials_path: service_account/ecmwf-lithops-deployer-key.json

gcp_cloudrun:
    runtime: gcr.io/e4drr-crafd/ecmwf-lithops-runtime:50r1
    runtime_memory: 2048       # 2 GB
    runtime_cpu: 2             # 2 vCPUs
    runtime_timeout: 3600      # 1 hour
    max_workers: 35            # 31 dates/month max + 4 buffer → avoids HTTP 500 on cold-start race
    min_workers: 0
    worker_processes: 1        # 1 process per container (pipeline is resource-intensive)

gcp_storage:
    bucket: gik-ecmwf-aws-tf
    region: europe-west3       # Frankfurt
